name: Deploy su Altervista

# Pubblica la build via FTP su vanzameteo.altervista.org.
# Secrets richiesti: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD.
# Variabili opzionali: FTP_SERVER_DIR (default "./"), BASE_HREF (default "/"),
# DEPLOY_ON_PUSH = "true" per pubblicare automaticamente ad ogni push su main.

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-altervista
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.DEPLOY_ON_PUSH == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:ci
      - run: npm run build -- --base-href "${{ vars.BASE_HREF || '/' }}"

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: dist/vanzameteo-angular/browser/
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
