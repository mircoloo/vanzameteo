name: Deploy su Altervista

# Pubblica la build via FTP su vanzameteo.altervista.org.
# Secrets richiesti: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD.
#
# Avvio manuale (Actions → Run workflow) con la scelta della destinazione:
#   - prova:      sottocartella /prova/ → https://vanzameteo.altervista.org/prova/
#   - principale: cartella principale del sito (o FTP_SERVER_DIR / BASE_HREF se impostate)
# Con la variabile DEPLOY_ON_PUSH = "true" pubblica anche nella principale a ogni push su dev/angular.

on:
  workflow_dispatch:
    inputs:
      destinazione:
        description: Dove pubblicare il sito
        type: choice
        options: [prova, principale]
        default: prova
  push:
    branches: [dev/angular]

concurrency:
  group: deploy-altervista
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.DEPLOY_ON_PUSH == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Scegli la destinazione
        id: target
        env:
          DESTINAZIONE: ${{ inputs.destinazione || 'principale' }}
          SERVER_DIR: ${{ vars.FTP_SERVER_DIR || './' }}
          BASE_HREF: ${{ vars.BASE_HREF || '/' }}
        run: |
          if [ "$DESTINAZIONE" = "prova" ]; then
            SERVER_DIR="prova/"
            BASE_HREF="/prova/"
          fi
          echo "server_dir=$SERVER_DIR" >> "$GITHUB_OUTPUT"
          echo "base_href=$BASE_HREF" >> "$GITHUB_OUTPUT"
          echo "Destinazione: $DESTINAZIONE (cartella FTP $SERVER_DIR, base href $BASE_HREF)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:ci
      - run: npm run build -- --base-href "${{ steps.target.outputs.base_href }}"

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: dist/vanzameteo-angular/browser/
          server-dir: ${{ steps.target.outputs.server_dir }}
